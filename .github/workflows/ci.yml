name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, code mort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm check
      - name: TypeScript
        run: pnpm typecheck
      - name: Knip
        run: pnpm knip
      - name: Audit des dépendances
        run: pnpm audit --audit-level high

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest avec couverture
        run: pnpm test:coverage
      - name: Rapport de couverture
        if: matrix.node == 22
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  action:
    name: Test de l’action
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Planning sur les fixtures
        id: planning
        uses: ./
        with:
          children: >-
            [{"name":"Alice","ics":"file://${{ github.workspace }}/tests/fixtures/pronote-4e.ics"},
             {"name":"Bob","ics":"file://${{ github.workspace }}/tests/fixtures/pronote-6e.ics"}]
          digest: planning
          channels: file
          file_dir: out
          archive_dir: archive-ci
          date: '2026-09-06'
      - name: Devoirs sur les fixtures
        id: homework
        uses: ./
        with:
          children: >-
            [{"name":"Alice","ics":"file://${{ github.workspace }}/tests/fixtures/pronote-4e.ics"}]
          digest: homework
          channels: file
          file_dir: out
          archive_dir: archive-ci
          date: '2026-09-07'
      - name: Vérifie les sorties
        env:
          PLANNING_DATE: ${{ steps.planning.outputs.target-date }}
          PLANNING_SUBJECT: ${{ steps.planning.outputs.subject }}
          HOMEWORK_DATE: ${{ steps.homework.outputs.target-date }}
          DELIVERED: ${{ steps.homework.outputs.delivered }}
        run: |
          set -euo pipefail
          test "$PLANNING_DATE" = "2026-09-07"
          test "$PLANNING_SUBJECT" = "[Pronote] Planning du lundi 7 septembre 2026"
          test "$HOMEWORK_DATE" = "2026-09-08"
          test "$DELIVERED" = "true"
          test -s out/2026-09-07/planning.html
          test -s out/2026-09-07/planning.md
          test -s out/2026-09-08/homework.json
          test -s archive-ci/2026-09-07/planning.json
          grep -q "ACC. PERSO. FRANCAIS" out/2026-09-07/planning.md
          grep -q "signer la charte" out/2026-09-08/homework.md
      - name: Rendus produits
        uses: actions/upload-artifact@v4
        with:
          name: rendus
          path: out
          retention-days: 7

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      major: ${{ steps.rp.outputs.major }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dist:
    # Compile dist/ dans la branche de la PR de release, pour que le commit de version le contienne.
    # Fait ici plutôt que sur l'événement pull_request : une PR ouverte avec GITHUB_TOKEN ne déclenche
    # aucun workflow.
    name: Compile dist dans la PR de release
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Commit de dist si nécessaire
        env:
          BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          git add dist
          if git diff --cached --quiet; then echo "dist déjà à jour"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): dist compilé"
          git push origin "HEAD:$BRANCH"

  major-tag:
    # Le commit de version contient dist/ : le tag vX.Y.Z posé par release-please est utilisable
    # tel quel. On ne fait que déplacer le tag majeur mobile (v0, v1…).
    name: Déplace le tag majeur
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - name: Vérifie que dist est présent
        run: test -s dist/action.js
      - name: Tag majeur
        env:
          MAJOR: v${{ needs.release-please.outputs.major }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$MAJOR"
          git push -f origin "$MAJOR"
